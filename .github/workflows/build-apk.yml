name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Preparar clave de firma
        env:
          PW: ${{ secrets.NOTESPRO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then
            echo "::error::Falta el secreto NOTESPRO_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # La clave de firma está en el repositorio cifrada; solo la contraseña es secreta.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/notespro.jks.enc -out "$RUNNER_TEMP/notespro.jks" -pass env:PW
          echo "NOTESPRO_KEYSTORE=$RUNNER_TEMP/notespro.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        env:
          NOTESPRO_KEYSTORE_PASSWORD: ${{ secrets.NOTESPRO_KEYSTORE_PASSWORD }}
          NOTESPRO_KEY_PASSWORD: ${{ secrets.NOTESPRO_KEYSTORE_PASSWORD }}
          NOTESPRO_KEY_ALIAS: notespro
          NOTESPRO_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Resumen del error como anotación (visible en la página del resultado).
            summary=$(awk '/What went wrong/{f=1} f{print} /^\* Try:/{exit}' "$RUNNER_TEMP/gradle.log" | head -60)
            [ -z "$summary" ] && summary=$(grep -iE "error|exception|failed" "$RUNNER_TEMP/gradle.log" | head -40)
            [ -z "$summary" ] && summary=$(tail -40 "$RUNNER_TEMP/gradle.log")
            enc=$(printf '%s' "$summary" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Error de Gradle::$enc"
            exit "$status"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/NotesPro-v1.0.${{ github.run_number }}.apk"

      - name: Publicar el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NotesPro v1.0.${{ github.run_number }}
          body: |
            Descarga el archivo **NotesPro-v1.0.${{ github.run_number }}.apk** desde la tablet e instálalo.
            Cambios: ${{ github.event.head_commit.message }}
          files: NotesPro-v1.0.${{ github.run_number }}.apk
          make_latest: true
